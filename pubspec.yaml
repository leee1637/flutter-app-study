name: warehouse_app
description: A warehouse management application

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^14.0.0
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  flutter_svg: ^2.0.10
  qr_flutter: any
  mobile_scanner: ^6.0.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.2
  connectivity_plus: ^6.0.5
  uuid: ^4.4.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: launcher_icon
  image_path: assets/icon/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svgs/